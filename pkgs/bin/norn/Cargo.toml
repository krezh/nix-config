[package]
name = "norn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "norn"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dix = "2"
eyre = "0.6"
glamour = { package = "charmed-glamour", version = "0.2" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "rustls"] }
url = "2"
